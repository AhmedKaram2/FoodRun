name: FoodRun
options:
  bundleIdPrefix: com.karim
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    FRAMEWORK_SEARCH_PATHS:
      - "$(inherited)"
      - "$(SRCROOT)/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
packages:
  IosComponents:
    path: Packages/IosComponents
targets:
  FoodRun:
    type: application
    platform: iOS
    sources: [FoodRun]
    dependencies:
      - package: IosComponents
    preBuildScripts:
      - name: Build shared Kotlin framework
        script: 'bash "$SRCROOT/Scripts/build-shared-ios.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karim.foodrun
        INFOPLIST_KEY_CFBundleDisplayName: Food Run
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "$(inherited) -framework FoodRunShared"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
  FoodRunTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FoodRunTests]
    dependencies:
      - target: FoodRun
schemes:
  FoodRun:
    build:
      targets:
        FoodRun: all
        FoodRunTests: [test]
    test:
      targets: [FoodRunTests]
