name: FoodRun
options:
  bundleIdPrefix: com.karim
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": YES
    FRAMEWORK_SEARCH_PATHS:
      - "$(inherited)"
      - "$(SRCROOT)/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
packages:
  IosComponents:
    path: Packages/IosComponents
targets:
  FoodRun:
    type: application
    platform: iOS
    sources: [FoodRun]
    info:
      path: FoodRun/Info.plist
      properties:
        NSBonjourServices: ["_foodrun._tcp"]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    entitlements:
      path: FoodRun/FoodRun.entitlements
      properties:
        application-identifier: "$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)"
        keychain-access-groups:
          - "$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)"
    dependencies:
      - package: IosComponents
    preBuildScripts:
      - name: Build shared Kotlin framework
        script: 'bash "$SRCROOT/Scripts/build-shared-ios.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karim.foodrun
        INFOPLIST_KEY_CFBundleDisplayName: Food Run
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Join your Food Run room and watch the same spin with people on your Wi-Fi.
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the pairing QR shown by your Food Run server.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "$(inherited) -framework FoodRunShared"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
  FoodRunTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FoodRunTests
        excludes: [HubIntegrationConfig.json]
    dependencies:
      - target: FoodRun
schemes:
  FoodRun:
    build:
      targets:
        FoodRun: all
        FoodRunTests: [test]
    test:
      targets: [FoodRunTests]
