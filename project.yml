name: FoodRun
options:
  bundleIdPrefix: com.karim
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.7.4"
    CURRENT_PROJECT_VERSION: "22"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": "x86_64"
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": YES
    FRAMEWORK_SEARCH_PATHS:
      - "$(inherited)"
      - "$(SRCROOT)/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    exactVersion: 9.2.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.19.0
  IosComponents:
    path: Packages/IosComponents
targets:
  FoodRun:
    type: application
    platform: iOS
    sources: [FoodRun]
    entitlements:
      path: FoodRun/FoodRun.entitlements
      properties:
        application-identifier: "$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)"
        keychain-access-groups:
          - "$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)"
    dependencies:
      - package: IosComponents
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseAuth
    preBuildScripts:
      - name: Build shared Kotlin framework
        script: 'bash "$SRCROOT/Scripts/build-shared-ios.sh"'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Bundle React Native code and images
        script: |
          export PROJECT_ROOT="$SRCROOT/mobileApp"
          export FORCE_BUNDLING=1
          WITH_ENVIRONMENT="$SRCROOT/mobileApp/node_modules/react-native/scripts/xcode/with-environment.sh"
          REACT_NATIVE_XCODE="$SRCROOT/mobileApp/node_modules/react-native/scripts/react-native-xcode.sh"
          /bin/sh -c "$WITH_ENVIRONMENT $REACT_NATIVE_XCODE"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/main.jsbundle"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karim.foodrun
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FoodRun/Info.plist
        APS_ENVIRONMENT: development
        INFOPLIST_KEY_CFBundleDisplayName: FoodRun
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Join your Intrvioo room and watch the same spin with people on your Wi-Fi.
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the pairing QR shown by your Intrvioo server.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "$(inherited) -framework FoodRunShared"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
  FoodRunTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FoodRunTests
        excludes: [HubIntegrationConfig.json]
    dependencies:
      - target: FoodRun
schemes:
  FoodRun:
    build:
      targets:
        FoodRun: all
        FoodRunTests: [test]
    test:
      targets: [FoodRunTests]
