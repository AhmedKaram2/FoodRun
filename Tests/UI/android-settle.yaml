appId: com.karim.foodrun
---
- scrollUntilVisible:
    element:
      id: "action:CONFIRM_TRANSFER:.*"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "action:CONFIRM_TRANSFER:.*"
- scrollUntilVisible:
    element:
      id: "action:FULFILL:"
    direction: UP
    centerElement: true
- tapOn:
    id: "action:FULFILL:"
- scrollUntilVisible:
    element:
      id: "action:ARCHIVE:"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "action:ARCHIVE:"
