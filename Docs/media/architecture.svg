<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">Food Run architecture</title><desc id="desc">Native iOS and Android apps share Kotlin state, domain rules and protocol. Native adapters connect them to a local JVM hub with encrypted SQLite record bodies.</desc><rect x="0.0" y="0.0" width="1920.0" height="1080.0" rx="0.0" fill="#FFF8EE"/><text x="80.0" y="71.203125" font-family="Arial, sans-serif" font-size="24.0" font-weight="700" fill="#EF602E">FOOD RUN  /  ARCHITECTURE</text><text x="80.0" y="162.80859375" font-family="Arial, sans-serif" font-size="66.0" font-weight="700" fill="#29261F">One shared core. Two native apps.</text><text x="80.0" y="211.00390625" font-family="Arial, sans-serif" font-size="30.0" font-weight="400" fill="#827C70">Permanent rooms on your local network. Native UI on every phone.</text><rect x="80.0" y="262.0" width="440.0" height="154.0" rx="24.0" fill="#FFFFFF"/><text x="110.0" y="320.8046875" font-family="Arial, sans-serif" font-size="36.0" font-weight="700" fill="#29261F">iOS</text><text x="110.0" y="361.169921875" font-family="Arial, sans-serif" font-size="25.0" font-weight="400" fill="#29261F">SwiftUI + IosComponents</text><text x="110.0" y="393.369140625" font-family="Arial, sans-serif" font-size="19.0" font-weight="400" fill="#827C70">Keychain · URLSession · native motion</text><rect x="560.0" y="262.0" width="440.0" height="154.0" rx="24.0" fill="#FFFFFF"/><text x="590.0" y="320.8046875" font-family="Arial, sans-serif" font-size="36.0" font-weight="700" fill="#29261F">Android</text><text x="590.0" y="361.169921875" font-family="Arial, sans-serif" font-size="25.0" font-weight="400" fill="#29261F">Jetpack Compose + components</text><text x="590.0" y="393.369140625" font-family="Arial, sans-serif" font-size="19.0" font-weight="400" fill="#827C70">Keystore · OkHttp · native motion</text><path d="M 300.0 423.0 L 300.0 467.0 M 293.28804245954115 454.7138441335348 L 300.0 467.0 L 306.71195754045885 454.7138441335348" fill="none" stroke="#EF602E" stroke-width="4"/><path d="M 780.0 423.0 L 780.0 467.0 M 773.2880424595412 454.7138441335348 L 780.0 467.0 L 786.7119575404588 454.7138441335348" fill="none" stroke="#EF602E" stroke-width="4"/><rect x="80.0" y="480.0" width="920.0" height="174.0" rx="24.0" fill="#FCE6D6"/><text x="110.0" y="541.771484375" font-family="Arial, sans-serif" font-size="37.0" font-weight="700" fill="#29261F">shared / Kotlin Multiplatform</text><text x="110.0" y="587.103515625" font-family="Arial, sans-serif" font-size="27.0" font-weight="400" fill="#29261F">State · actions · navigation · validation · offline cache</text><text x="110.0" y="630.236328125" font-family="Arial, sans-serif" font-size="23.0" font-weight="400" fill="#827C70">GroupController + GroupPlatform native service boundary</text><path d="M 300.0 665.0 L 300.0 711.0 M 293.28804245954115 698.7138441335347 L 300.0 711.0 L 306.71195754045885 698.7138441335347" fill="none" stroke="#EF602E" stroke-width="4"/><path d="M 780.0 665.0 L 780.0 711.0 M 773.2880424595412 698.7138441335347 L 780.0 711.0 L 786.7119575404588 698.7138441335347" fill="none" stroke="#EF602E" stroke-width="4"/><rect x="80.0" y="728.0" width="440.0" height="160.0" rx="24.0" fill="#FFFFFF"/><text x="110.0" y="785.9375" font-family="Arial, sans-serif" font-size="32.0" font-weight="700" fill="#29261F">order-domain</text><text x="110.0" y="829.169921875" font-family="Arial, sans-serif" font-size="25.0" font-weight="400" fill="#29261F">Menu · money · billing</text><text x="110.0" y="868.26953125" font-family="Arial, sans-serif" font-size="22.0" font-weight="400" fill="#827C70">Rules + shared spin curve</text><rect x="560.0" y="728.0" width="440.0" height="160.0" rx="24.0" fill="#FFFFFF"/><text x="590.0" y="785.9375" font-family="Arial, sans-serif" font-size="32.0" font-weight="700" fill="#29261F">order-contract</text><text x="590.0" y="829.169921875" font-family="Arial, sans-serif" font-size="25.0" font-weight="400" fill="#29261F">Commands · replies · pairing</text><text x="590.0" y="868.26953125" font-family="Arial, sans-serif" font-size="22.0" font-weight="400" fill="#827C70">Protocol v1 · Kotlin serialization</text><rect x="1110.0" y="262.0" width="730.0" height="126.0" rx="24.0" fill="#FCE6D6"/><text x="1140.0" y="317.9375" font-family="Arial, sans-serif" font-size="32.0" font-weight="700" fill="#29261F">Same reachable local network</text><text x="1140.0" y="362.169921875" font-family="Arial, sans-serif" font-size="25.0" font-weight="400" fill="#29261F">HTTPS / WSS · certificate fingerprint pinning</text><path d="M 1011.0 566.0 L 1096.0 566.0 M 1083.7138441335348 572.7119575404588 L 1096.0 566.0 L 1083.7138441335348 559.2880424595412" fill="none" stroke="#EF602E" stroke-width="4"/><rect x="1110.0" y="480.0" width="730.0" height="232.0" rx="24.0" fill="#EF602E"/><text x="1144.0" y="545.73828125" font-family="Arial, sans-serif" font-size="38.0" font-weight="700" fill="#FFFFFF">Local Mac / PC hub</text><text x="1144.0" y="594.00390625" font-family="Arial, sans-serif" font-size="30.0" font-weight="400" fill="#FFFFFF">Ktor / JVM · room-server</text><text x="1144.0" y="641.13671875" font-family="Arial, sans-serif" font-size="26.0" font-weight="400" fill="#FFFFFF">Authoritative spins, roles and settlement</text><text x="1144.0" y="684.236328125" font-family="Arial, sans-serif" font-size="23.0" font-weight="400" fill="#FFFFFF">Native adapters send commands + receive snapshots</text><path d="M 1475.0 723.0 L 1475.0 757.0 M 1468.2880424595412 744.7138441335347 L 1475.0 757.0 L 1481.7119575404588 744.7138441335347" fill="none" stroke="#EF602E" stroke-width="4"/><rect x="1110.0" y="774.0" width="730.0" height="114.0" rx="24.0" fill="#FFFFFF"/><text x="1140.0" y="824.970703125" font-family="Arial, sans-serif" font-size="31.0" font-weight="700" fill="#29261F">SQLite + encrypted record bodies</text><text x="1140.0" y="868.203125" font-family="Arial, sans-serif" font-size="24.0" font-weight="400" fill="#827C70">Rooms · sessions · command results · order history</text><rect x="80.0" y="936.0" width="1760.0" height="76.0" rx="24.0" fill="#EEEEDD"/><text x="110.0" y="985.103515625" font-family="Arial, sans-serif" font-size="27.0" font-weight="700" fill="#617E53">Quick Spin is offline. Group updates need the hub. Downloaded receipts stay on the phone.</text></svg>
